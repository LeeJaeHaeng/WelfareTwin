program: BASIC_PENSION
cases:
  - name: 단독 — 소득·재산 없음
    source: 고시 제2026-156호 제3조 기준연금액 349,700원
    household: {region_sido: 서울특별시, members: [{age: 70}]}
    expect: {eligible: true, benefit_monthly: 349700}
  - name: 부부 — 각각 20% 감액
    source: 기초연금법 제8조제1항 (349,700 × 0.8 × 2)
    household: {region_sido: 서울특별시, members: [{age: 72}, {age: 70, sex: F}]}
    expect: {eligible: true, benefit_monthly: 559520}
  - name: 단독 근로소득 200만원 — 116만원 공제 후 70%
    source: 고시 제6조, 보도자료 붙임1 ((근로소득 − 116만원) × 70%)
    household: {region_sido: 대구광역시, members: [{age: 67, employed: true, earned_income: 2000000}]}
    expect: {eligible: true}
    expect_derived: {bp_income_recognized: 588000}
  - name: 단독 근로소득 468만원 — 선정기준 이내
    source: 고시 제2조 단독 2,470,000원 ((4,680,000 − 1,160,000) × 0.7 = 2,464,000)
    household: {region_sido: 대구광역시, members: [{age: 67, employed: true, earned_income: 4680000}]}
    expect: {eligible: true}
  - name: 단독 근로소득 469만원 — 선정기준 초과
    source: 고시 제2조 ((4,690,000 − 1,160,000) × 0.7 = 2,471,000 > 2,470,000)
    household: {region_sido: 대구광역시, members: [{age: 67, employed: true, earned_income: 4690000}]}
    expect: {eligible: false, benefit_monthly: 0}
  - name: 고급자동차 4,500만원 — 전액 소득 반영
    source: 보도자료 붙임1 (고급 자동차 4,000만원 이상 가액 전액 소득 반영)
    household: {region_sido: 대구광역시, car_value: 45000000, members: [{age: 70}]}
    expect: {eligible: false}
  - name: 농어촌 주택 2억원 — 기본재산액 7,250만원 공제 후 연 4%
    source: 고시 제8조 농어촌(도의 군) 7,250만원; 소득환산율 4% ÷ 12
    household: {region_sido: 경상북도, region_sigungu: 의성군, housing: own, assets_housing: 200000000, members: [{age: 78}]}
    expect: {eligible: true, benefit_monthly: 349700}
    expect_derived: {bp_income_recognized: 425000}
  - name: 65세 미만만 있는 가구 → 해당 없음
    source: 보도자료 붙임2 (만 65세 이상)
    household: {region_sido: 경상북도, members: [{age: 64}]}
    expect: {eligible: false}

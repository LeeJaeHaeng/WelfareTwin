id: LOCAL_WLF00005203
name: 저소득층 여성청소년 생리용품 지원
level: local
region:
  sido: 경상북도
  sigungu: 청송군
unit: household
source_refs:
- doc: 한국사회보장정보원 지자체복지서비스 상세 WLF00005203 (저소득층 여성청소년 생리용품 지원)
  clause: 지원대상·선정기준·지원내용
assumptions:
- 시군구 단위 사업도 시도 단위로 판정(합성 인구·형식검증에 시군구 없음)
- 표현하지 못한 조건 3개(not_modeled) → 대상 과대 추정
eligibility:
  all:
  - expr: count(p.age >= 11 and p.age <= 18 and p.sex == 'F') >= 1
    label: 만11세 이상 만18세 이하 여성청소년
    quote: 만11세 이상 만18세 이하 여성청소년
    uncertain: false
    ref: 0
  - expr: elig('NBLS_LIVELIHOOD') or elig('NBLS_MEDICAL') or elig('NBLS_HOUSING') or elig('NBLS_EDUCATION') or nbls_income_recognized
      <= round(median_income(hh.size) * 50 / 100) or hh.single_parent
    label: 기초생활수급자 또는 법정차상위계층 또는 한부모가족지원법 지원대상자
    quote: 「국민기초생활보장법」 따른 생계,의료,주거,교육 급여 수급자 「국민기초생활보장법」 따른 법정차상위계층     *차상위계층:차상위자활, 차상위본인부담경감대상자, 차상위장애인, 차상위계층확인서 발급「한부모가족지원법」
      제5조 및 제5조의2에 따른 지원대상자
    uncertain: true
    ref: 0
benefit:
  monthly: '13000'
  quote: 생리용품 구매 바우처 연 최대 156천원(월13천원) 지원
  uncertain: true
  ref: 0
not_modeled:
- quote: 저소득층 여성청소년 위생용품 지원 사업 대상자가 아닌
  reason: 다른 사업 수혜 여부는 표현식으로 나타낼 수 없음
- quote: 차상위계층:차상위자활, 차상위본인부담경감대상자, 차상위장애인, 차상위계층확인서 발급
  reason: 차상위 세부 유형(자활, 본인부담경감, 장애인, 확인서 발급) 구분은 표현 불가
- quote: 「한부모가족지원법」 제5조 및 제5조의2에 따른 지원대상자
  reason: 법정 한부모가족 지원대상자 여부는 소득기준 등 별도 심사가 필요하며, hh.single_parent로는 정확히 표현 불가
status: draft
provenance:
  serv_id: WLF00005203
  variant: B
  model: claude-opus-5
  prompt_version: extract-v1
  source_hash: 8170be77216ba94c
  notes: 거주지 조건은 region(경상북도 청송군)으로 분리. 연령·성별 조건은 가구 내 해당 여성청소년 존재 여부로 모델링. 선정기준의 세 가지 자격(수급자/법정차상위/한부모 지원대상자)은 택일 요건으로 보아
    or로 묶었으며, 차상위 및 한부모 판정은 근사치이므로 uncertain=true. 급여는 월 13,000원(연 최대 156,000원)으로 '최대' 표현이 있어 uncertain=true.

id: LOCAL_WLF00004553
name: 저소득 어르신 무료틀니 지원사업
level: local
region:
  sido: 대구광역시
  sigungu: 달서구
unit: household
source_refs:
- doc: 한국사회보장정보원 지자체복지서비스 상세 WLF00004553 (저소득 어르신 무료틀니 지원사업)
  clause: 지원대상·선정기준·지원내용
assumptions:
- 시군구 단위 사업도 시도 단위로 판정(합성 인구·형식검증에 시군구 없음)
- 1회성 지원은 연 1회 지급으로 보고 월 환산(÷12)
- 표현하지 못한 조건 2개(not_modeled) → 대상 과대 추정
eligibility:
  all:
  - expr: count(p.age >= 65) >= 1
    label: 만 65세 이상
    quote: 달서구 주민중 만65세 이상
    uncertain: false
    ref: 0
  - expr: elig('NBLS_MEDICAL') or nbls_income_recognized <= round(median_income(hh.size) * 50 / 100)
    label: 의료급여 수급자 또는 차상위 건강보험전환자
    quote: 기초생활 의료급여 수급자 및 차상위 건강보험전환자
    uncertain: true
    ref: 0
benefit:
  annual: '0'
  quote: 노인의치(틀니) 시술비용 지원 및 사후관리 완전틀니, 부분틀니 본인부담금 5~15% 지원
  uncertain: true
  ref: 0
not_modeled:
- quote: 단, 부분의치 양악지원 경우 지대치 보철 최대6개까지 지원
  reason: 시술 범위에 관한 제한으로 자격·급여액 표현식으로 환산 불가
- quote: 차상위 건강보험전환자
  reason: 차상위 건강보험 전환 여부는 별도 자격 구분으로, 소득인정액 기준(중위 50% 이하)으로만 근사 표현함
status: draft
provenance:
  serv_id: WLF00004553
  variant: B
  model: claude-opus-5
  prompt_version: extract-v1
  source_hash: ed94b363edc20abe
  notes: 거주지 요건(달서구 주민)은 region으로 분리했다. 급여는 본인부담금의 5~15%를 지원하는 비율 지원이고 시술비 총액을 알 수 없어 expr=0, uncertain=true로 처리했다. 원문 지원주기는
    '월'로 표기되어 있으나 틀니 시술비 지원 성격상 period는 once로 두었다(불확실).

id: LOCAL_WLF00006585
name: 청소년부모 아동양육비 추가 지원사업
level: local
region:
  sido: 경상북도
  sigungu: null
unit: household
source_refs:
- doc: 한국사회보장정보원 지자체복지서비스 상세 WLF00006585 (청소년부모 아동양육비 추가 지원사업)
  clause: 지원대상·선정기준·지원내용
assumptions:
- 시군구 단위 사업도 시도 단위로 판정(합성 인구·형식검증에 시군구 없음)
- 표현하지 못한 조건 2개(not_modeled) → 대상 과대 추정
eligibility:
  all:
  - expr: nbls_income_recognized <= round(median_income(hh.size) * 65 / 100)
    label: 기준 중위소득 65% 이하
    quote: 기준 중위소득 65% 이하
    uncertain: true
    ref: 0
  - expr: count(p.age <= 24) >= 2
    label: 부모 모두 24세 이하(청소년부모)
    quote: '청소년부모 : 자녀를 실양육하는 부모 모두 24세 이하 가구'
    uncertain: true
    ref: 0
  - expr: hh.n_child >= 1
    label: 양육 중인 자녀 존재
    quote: 자녀를 양육하는 부모 모두 24세 이하 가구 추가 지원
    uncertain: true
    ref: 0
benefit:
  monthly: 200000 * hh.n_child
  quote: 아동양육비 월20만원/1인 추가지원
  uncertain: true
  ref: 0
not_modeled:
- quote: 자녀를 실양육하는 부모 모두 24세 이하 가구
  reason: 가구원 중 누가 '부모'인지 식별하는 속성이 없어 실제 양육 여부와 부모 관계를 정확히 표현할 수 없음(24세 이하 가구원 2명 이상으로 근사)
- quote: 아동양육비 월20만원/1인 추가지원
  reason: '''추가지원''이므로 기본 아동양육비 지원사업 선정 여부가 전제될 수 있으나 원문에 기준이 명시되지 않음'
status: draft
provenance:
  serv_id: WLF00006585
  variant: B
  model: claude-opus-5
  prompt_version: extract-v1
  source_hash: cc87fd749bd4af1b
  notes: 소득기준이 '소득인정액'으로 명시되지 않아 중위소득 65% 조건은 uncertain 처리. 지원액은 자녀 1인당 월 20만원으로 보아 자녀 수에 비례하도록 모델링했으며, 자녀 연령 기준이 원문에 없어 hh.n_child(18세
    미만)로 근사함.

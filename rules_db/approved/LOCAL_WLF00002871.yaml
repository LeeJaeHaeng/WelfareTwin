id: LOCAL_WLF00002871
name: 저소득노인지원
level: local
region:
  sido: 경상북도
  sigungu: 청도군
unit: household
source_refs:
- doc: 한국사회보장정보원 지자체복지서비스 상세 WLF00002871 (저소득노인지원)
  clause: 지원대상·선정기준·지원내용
assumptions:
- 시군구 단위 사업도 시도 단위로 판정(합성 인구·형식검증에 시군구 없음)
- 표현하지 못한 조건 4개(not_modeled) → 대상 과대 추정
eligibility:
  all:
  - expr: count(p.age >= 80) >= 1
    label: 만 80세 이상 노인 포함
    quote: 80세 이상 기초수급 독거노인
    uncertain: false
    ref: 0
  - expr: hh.size == 1
    label: 독거(1인 가구)
    quote: 80세 이상 기초수급 독거노인
    uncertain: false
    ref: 0
  - expr: elig('NBLS_LIVELIHOOD') or elig('NBLS_MEDICAL') or elig('NBLS_HOUSING') or elig('NBLS_EDUCATION')
    label: 국민기초생활수급자
    quote: 80세이상 국민기초생활수급 독거 어르신
    uncertain: false
    ref: 0
benefit:
  annual: '0'
  quote: 생신케이크(롤케이크)을 생신월에 맞쳐 가정에 전달
  uncertain: true
  ref: 0
not_modeled:
- quote: 80세이상 국민기초생활수급 독거 어르신 등 생계가 어려우신 분으로 사업마다 조건이 다름
  reason: 세부 사업별로 선정기준이 달라 단일 규칙으로 표현 불가하며 '생계가 어려우신 분'은 기관 판단 사항
- quote: '거동불편 재가노인 식사배달 : 175명'
  reason: 거동 불편 여부 및 인원 제한(정원)은 표현식으로 표현 불가
- quote: '무의탁노인 건강음료배달: 노인돌봄기본서비스 대상자 1,000명'
  reason: 무의탁 여부·타 사업(노인돌봄기본서비스) 수혜 여부 및 인원 제한은 표현 불가
- quote: '무료급식 : 기초수급자, 차상위계층 및 식사를 거를 우려가 있는 노인'
  reason: 무료급식 세부사업의 별도 기준이며 '식사를 거를 우려'는 기관 판단 사항
status: approved
provenance:
  serv_id: WLF00002871
  variant: A
  model: claude-opus-5
  prompt_version: extract-v1
  source_hash: 34b6f6e6eb636529
  notes: 선정기준 본문이 명시한 '80세 이상 국민기초생활수급 독거 어르신'(= 생신케이크 전달 대상)을 대표 조건으로 모델링했다. 나머지 식사배달·건강음료배달·무료급식은 각각 별도 기준이어서 not_modeled로
    분리했다. 지원내용에 금액이 없고 현물(케이크) 제공이므로 급여액은 0, uncertain=true로 두었고 지원주기 '년'에 따라 annual로 설정했다.
tests: tests/rules/LOCAL_WLF00002871.yaml

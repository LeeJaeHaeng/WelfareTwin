# 기초생활보장 소득인정액 — 생계·의료·주거·교육급여가 공유한다.
# 소득인정액 = 소득평가액 + 재산의 소득환산액 (사업안내 2026 p.51)
library: NBLS_INCOME
name: 기초생활보장 소득인정액
source_refs:
  - {doc: 2026년 국민기초생활보장 사업안내, page: 51, clause: 소득인정액 산정방식}
  - {doc: 2026년 국민기초생활보장 사업안내, page: 105, clause: 근로를 유인하기 위한 요인(근로소득 공제)}
  - {doc: 2026년 국민기초생활보장 사업안내, page: 134, clause: 수급(권)자의 주거용재산 한도액}
  - {doc: 2026년 국민기초생활보장 사업안내, page: 148, clause: 금융재산 생활준비금 공제}
  - {doc: 2026년 국민기초생활보장 사업안내, page: 163, clause: 부채를 차감하는 순서}
  - {doc: 2026년 국민기초생활보장 사업안내, page: 165, clause: 기본재산액 및 공제 순서}
  - {doc: 2026년 국민기초생활보장 사업안내, page: 166, clause: 재산의 종류별 소득환산율}
  - {doc: 2026년 국민기초생활보장 사업안내, page: 122, clause: 공적이전소득의 범위 — (가) 기초연금법에 따른 기초연금}
assumptions:
  - 가구특성별 지출비용(장애·질병·양육 등 소득평가액 제외 금품)은 반영하지 않음 → 소득평가액이 다소 과대
  - 기초연금은 이 규칙 세트의 기초연금 판정 급여액을 그대로 소득평가액에 더함(p.122, p.124 표 '실제소득 포함 ○'). 장애인연금에서 전환된 기초연금의 주거·교육급여 예외와 주거급여 특례(p.xvii)는 미반영
  - 기초연금 외 공적이전소득(국민연금 등)은 Person.other_income 으로 입력해야 반영됨
  - 근로소득공제 특례는 34세 이하(대학생 포함 간주)·65세 이상·등록장애인만 반영. 북한이탈주민·35세 이상 학생·임산부·자활근로 특례는 미반영
  - 같은 사람이 여러 공제 항목에 해당하면 가장 유리한 하나만 적용(p.105)
  - 자동차는 소득환산율 100% 차량만 car_value 로 입력. 일반재산 환산(4.17%) 차량은 assets_general 에 포함, 재산 제외 차량(생업용 등)은 입력하지 않음
  - 입력한 부채는 전액 인정(부채 유형별 인정 요건 미반영), 장기금융저축공제 미반영
  - 인천의 기본재산액·주거용재산 한도는 '광역' 구간 적용(사업안내에 명시 없음)
  - 기본재산액과 부채는 같은 순서(주거용 → 일반 → 금융)로 차감하므로 합쳐서 한 번에 차감. 100% 환산 자동차에서는 차감하지 않음(p.163, p.165)
derived:
  nbls_work_income_net:
    label: 근로·사업소득(공제 후, 생계·주거·교육)
    ref: 1
    expr: >-
      sum(p.earned_income + p.business_income - max(
        params.nbls_earned_deduction_rate * (p.earned_income + p.business_income),
        if(p.age <= params.nbls_earned_deduction_youth_max_age,
           min(p.earned_income + p.business_income, params.nbls_earned_deduction_youth_flat)
           + params.nbls_earned_deduction_special_rate
             * max(0, p.earned_income + p.business_income - params.nbls_earned_deduction_youth_flat), 0),
        if(p.age >= params.nbls_earned_deduction_senior_min_age or p.disability != 'none',
           min(p.earned_income + p.business_income, params.nbls_earned_deduction_senior_disabled_flat)
           + params.nbls_earned_deduction_special_rate
             * max(0, p.earned_income + p.business_income - params.nbls_earned_deduction_senior_disabled_flat), 0)))
  nbls_work_income_net_medical:
    label: 근로·사업소득(공제 후, 의료급여 — 일반 30% 공제 없음)
    ref: 1
    expr: >-
      sum(p.earned_income + p.business_income - max(0,
        if(p.age <= params.nbls_earned_deduction_youth_max_age,
           min(p.earned_income + p.business_income, params.nbls_earned_deduction_youth_flat)
           + params.nbls_earned_deduction_special_rate
             * max(0, p.earned_income + p.business_income - params.nbls_earned_deduction_youth_flat), 0),
        if(p.age >= params.nbls_earned_deduction_senior_min_age or p.disability != 'none',
           min(p.earned_income + p.business_income, params.nbls_earned_deduction_senior_disabled_flat)
           + params.nbls_earned_deduction_special_rate
             * max(0, p.earned_income + p.business_income - params.nbls_earned_deduction_senior_disabled_flat), 0)))
  nbls_income_eval:
    label: 소득평가액(기초연금 포함)
    ref: 7
    expr: max(0, nbls_work_income_net + hh.other_income + benefit('BASIC_PENSION'))
  nbls_income_eval_medical:
    label: 소득평가액(의료급여)
    ref: 0
    expr: max(0, nbls_work_income_net_medical + hh.other_income + benefit('BASIC_PENSION'))
  nbls_housing_capped:
    label: 주거용재산(한도 이내)
    ref: 2
    expr: min(hh.assets_housing, lookup('nbls_housing_property_cap', hh.region_group))
  nbls_general_total:
    label: 일반재산(주거용 한도 초과분 포함)
    ref: 2
    expr: hh.assets_general + hh.assets_housing - nbls_housing_capped
  nbls_financial_net:
    label: 금융재산(생활준비금 공제 후)
    ref: 3
    expr: max(0, hh.assets_financial - params.nbls_financial_living_reserve)
  nbls_property_deduction:
    label: 기본재산액 + 부채
    ref: 5
    expr: lookup('nbls_basic_property_deduction', hh.region_group) + hh.debts
  nbls_housing_after:
    label: 주거용재산(공제 후)
    ref: 5
    expr: max(0, nbls_housing_capped - nbls_property_deduction)
  nbls_deduction_left1:
    expr: max(0, nbls_property_deduction - nbls_housing_capped)
  nbls_general_after:
    label: 일반재산(공제 후)
    ref: 5
    expr: max(0, nbls_general_total - nbls_deduction_left1)
  nbls_deduction_left2:
    expr: max(0, nbls_deduction_left1 - nbls_general_total)
  nbls_financial_after:
    label: 금융재산(공제 후)
    ref: 5
    expr: max(0, nbls_financial_net - nbls_deduction_left2)
  nbls_property_income:
    label: 재산의 소득환산액
    ref: 6
    expr: >-
      nbls_housing_after * params.nbls_conv_rate_housing
      + nbls_general_after * params.nbls_conv_rate_general
      + nbls_financial_after * params.nbls_conv_rate_financial
      + hh.car_value * params.nbls_conv_rate_car
  nbls_income_recognized:
    label: 소득인정액
    ref: 0
    expr: nbls_income_eval + nbls_property_income
  nbls_income_recognized_medical:
    label: 소득인정액(의료급여)
    ref: 0
    expr: nbls_income_eval_medical + nbls_property_income

id: LOCAL_WLF00005203
name: 저소득층 여성청소년 생리용품 지원
level: local
region:
  sido: 경상북도
  sigungu: 청송군
unit: household
source_refs:
- doc: 한국사회보장정보원 지자체복지서비스 상세 WLF00005203 (저소득층 여성청소년 생리용품 지원)
  clause: 지원대상·선정기준·지원내용
assumptions:
- 시군구 단위 사업도 시도 단위로 판정(합성 인구·형식검증에 시군구 없음)
- 표현하지 못한 조건 3개(not_modeled) → 대상 과대 추정
eligibility:
  all:
  - expr: count(p.sex == 'F' and p.age >= 11 and p.age <= 18) >= 1
    label: 만 11~18세 여성청소년 포함 가구
    quote: 만11세 이상 만18세 이하 여성청소년
    uncertain: false
    ref: 0
  - expr: elig('NBLS_LIVELIHOOD') or elig('NBLS_MEDICAL') or elig('NBLS_HOUSING') or elig('NBLS_EDUCATION') or nbls_income_recognized
      <= round(median_income(hh.size) * 50 / 100) or hh.single_parent
    label: 기초생활수급자 또는 법정차상위계층 또는 한부모가족 지원대상자
    quote: 「국민기초생활보장법」 따른 생계,의료,주거,교육 급여 수급자 「국민기초생활보장법」 따른 법정차상위계층     *차상위계층:차상위자활, 차상위본인부담경감대상자, 차상위장애인, 차상위계층확인서 발급「한부모가족지원법」
      제5조 및 제5조의2에 따른 지원대상자
    uncertain: true
    ref: 0
benefit:
  monthly: '13000'
  quote: 생리용품 구매 바우처 연 최대 156천원(월13천원) 지원
  uncertain: true
  ref: 0
not_modeled:
- quote: 저소득층 여성청소년 위생용품 지원 사업 대상자가 아닌
  reason: 다른 사업(국비 저소득층 여성청소년 위생용품 지원) 수혜 여부는 표현할 수 없음
- quote: 청송군에 주소를 둔
  reason: 거주지 조건은 region으로 처리
- quote: 「한부모가족지원법」 제5조 및 제5조의2에 따른 지원대상자
  reason: 한부모가족지원법상 지원대상자 결정(소득기준 및 기관 판단)은 hh.single_parent로 근사하여 조건식에 포함했으나 법정 지원대상자 여부 자체는 표현 불가
status: approved
provenance:
  serv_id: WLF00005203
  variant: A
  model: claude-opus-5
  prompt_version: extract-v1
  source_hash: 8170be77216ba94c
  notes: 지원대상의 연령·성별 조건과 선정기준의 수급자격 조건을 각각 조건으로 옮겼다. 차상위계층은 세부 유형(차상위자활, 본인부담경감, 차상위장애인, 확인서 발급) 구분이 불가하여 소득인정액 기준 중위소득 50%
    이하로 근사했으며 uncertain=true. 급여는 월 13,000원(연 최대 156,000원)으로 '최대' 표현이 있어 uncertain=true.
tests: tests/rules/LOCAL_WLF00005203.yaml

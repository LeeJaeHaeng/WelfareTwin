# 2026년 제도 기준값. 문서 04·CLAUDE.md 원칙 2 — 모든 값은 출처와 함께, 코드 하드코딩 금지.
# 각 항목: value / unit / source{doc, page, url} / verified / note
# - 출처 원문과 대조하지 않은 값은 value 를 null 또는 verified: false 로 둔다.
# - verified: true 로 바꾸려면 value 가 채워져 있고 source.doc 와 (page 또는 url) 이 있어야 한다(테스트로 강제).
# - 2026-11-10: 1~6인 기준중위소득·급여별 비율·선정기준액을 보도자료 4쪽 표와 이미지로 대조해 입력.
# - 선정기준액 = 중위소득 × 비율을 원 미만 반올림(ROUND_HALF_UP)하면 공표값 24칸과 모두 일치.
#   반올림 규칙 자체는 문서에 명시된 것이 아니라 공표값에서 추론한 것(tests/test_params.py 로 고정).


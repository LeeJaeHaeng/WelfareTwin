id: LOCAL_WLF00005860
name: 영천시 청년근로자 월세 지원
level: local
region:
  sido: 경상북도
  sigungu: 영천시
unit: household
source_refs:
- doc: 한국사회보장정보원 지자체복지서비스 상세 WLF00005860 (영천시 청년근로자 월세 지원)
  clause: 지원대상·선정기준·지원내용
assumptions:
- 시군구 단위 사업도 시도 단위로 판정(합성 인구·형식검증에 시군구 없음)
- 표현하지 못한 조건 9개(not_modeled) → 대상 과대 추정
eligibility:
  all:
  - expr: count(p.age >= 19 and p.age <= 45 and p.employed) >= 1
    label: 만 19~45세 청년근로자 포함
    quote: 영천시에 부모와 별도 거주하는 만 19세 ~ 45세 이하의 청년근로자
    uncertain: true
    ref: 0
  - expr: nbls_income_recognized <= round(median_income(hh.size) * 120 / 100)
    label: 기준 중위소득 120% 이하
    quote: (청년가구) 기준 중위소득  120%* 이하
    uncertain: true
    ref: 0
  - expr: hh.assets_housing + hh.assets_general + hh.assets_financial + hh.car_value - hh.debts <= 122000000
    label: 가구재산 1억 2천 2백만원 이하
    quote: (재산기준) 청년 가구재산 1억 2천 2백만원 이하
    uncertain: true
    ref: 0
  - expr: hh.housing != 'own'
    label: 주택 소유자 제외
    quote: 주택 소유자(분양권, 입주권 포함)
    uncertain: true
    ref: 0
  - expr: not elig('NBLS_HOUSING')
    label: 주거급여 수혜자 제외
    quote: 기초생활수급자 중 주거급여 수혜자
    uncertain: false
    ref: 0
benefit:
  monthly: '200000'
  quote: 월세지원금 200,000원 최대 12회 매월 25일 지급
  uncertain: false
  ref: 0
not_modeled:
- quote: 영천시에 부모와 별도 거주하는
  reason: 부모와의 별도 거주 여부는 가구·가구원 변수로 표현할 수 없음
- quote: 정부 등 유사 주거 지원사업을 지원 받고있는 자(지급 완료자는 가능)
  reason: 다른 사업 수혜 여부는 표현 불가
- quote: 공공임대(국민임대, 영구임대, LH임대, 행복주택, 공무원 임대주택 등)    거주자
  reason: 임대주택 유형(공공임대 여부)은 housing 변수로 구분 불가
- quote: 2촌이내 주택 임차자, 1실방 다수    거주 방식 전대차
  reason: 임대차 관계·계약 형태는 표현 불가
- quote: 국토부 청년월세한시특별지원사업 대상자
  reason: 타 사업 대상자 여부는 표현 불가
- quote: 임대인이 ‘가족관계증명서’에 등재된 신청인의 ‘부모,형제,자매’인 경우
  reason: 임대인과의 가족관계는 표현 불가
- quote: 기타 사업 취지에 부합하지 않다고 판단되는 경우
  reason: 기관 판단 사항
- quote: 국가 및 지방자치단체 공무원(공무직 포함)
  reason: 공무원 여부는 표현 불가
- quote: 월세지원금 200,000원 최대 12회 매월 25일 지급
  reason: 최대 12회라는 지급 횟수 제한은 월 단위 급여식으로 표현 불가
status: review

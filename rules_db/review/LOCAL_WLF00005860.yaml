    부채 차감 여부가 불명확해 uncertain으로 두었다. 월세 거주 요건은 사업 성격상 전제되나 원문에 명시 문구가 없어 조건으로 넣지 않았고, 주택 소유자 제외 조건만 반영했다.
  human_edits:

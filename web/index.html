* { box-sizing: border-box; }

/* ---------- header */
header.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 90%, transparent);
  backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px); border-bottom: 1px solid var(--border); }
header.top .wrap { display: flex; align-items: center; gap: 20px; min-height: 64px; }

  background: var(--surface); color: var(--text-2); cursor: pointer; text-decoration: none; }

  nav.tabs::-webkit-scrollbar { display: none; }
}
@media (max-width: 480px) { .gh span { display: none; } .gh { padding: 0; width: 44px; justify-content: center; } }

/* ---------- type */

section.view { display: none; }

}

/* ---------- surfaces */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; min-width: 0; }
.card.flush { padding: 0; overflow: hidden; }
.card-label { margin: 0 0 4px; font-size: 12.5px; font-weight: 600; letter-spacing: 0.04em; color: var(--muted); }
@media (max-width: 640px) { .card { padding: 18px; border-radius: 14px; } }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.mt { margin-top: 16px; } .mt2 { margin-top: 28px; } .mb { margin-bottom: 16px; } .mb2 { margin-bottom: 28px; }

/* ---------- numbers */
.band { border-top: 2px solid var(--text); display: grid; grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr)); }
.band > div { padding: 20px 24px 6px; min-width: 0; }
.band > div:first-child { padding-left: 0; }
.band > div + div { border-left: 1px solid var(--border); }

  .band { grid-template-columns: repeat(2, minmax(0, 1fr)); }

  .band > div:nth-child(even) { padding-left: 16px; border-left: 1px solid var(--border) !important; }
  .band.c3 > div:last-child { grid-column: 1 / -1; padding-left: 0; border-left: 0 !important; }
}
.stat .l { margin: 0; font-size: 13px; color: var(--text-2); }

.stat .v.crit { color: var(--crit-text); } .stat .v.crit small { color: var(--crit-text); }
.stat .s { margin: 8px 0 0; font-size: 13px; color: var(--muted); }

  background: var(--surface-2); color: var(--text-2); white-space: nowrap; }

/* ---------- buttons, inputs */
.btn { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 22px; border-radius: 12px; font: inherit;
  font-weight: 600; text-decoration: none; cursor: pointer; border: 1px solid transparent; }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-hover); color: var(--on-accent); }
.btn.ghost { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
.btn.ghost:hover { border-color: var(--text-2); color: var(--text); }
.field-label { display: block; font-size: 13px; font-weight: 600; color: var(--text-2); margin: 0 0 8px; }
.select { position: relative; }
.select select { appearance: none; -webkit-appearance: none; width: 100%; min-height: 48px; font: inherit; font-size: 15px; padding: 10px 44px 10px 14px;
  border-radius: 12px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); cursor: pointer; }

@media (max-width: 480px) { .choices { grid-template-columns: 1fr; } }
.choice { text-align: left; font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  padding: 14px 16px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-height: 64px; }
.choice:hover { border-color: var(--border-strong); }

.slider-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

/* ---------- content */
.muted { color: var(--muted); } .small { font-size: 13.5px; } .xs { font-size: 12.5px; }
.mono { font-family: var(--mono); font-size: 12.5px; word-break: break-word; }

/* ---------- home */

/* ---------- pager, footer */

footer { border-top: 1px solid var(--border); color: var(--muted); font-size: 13px; }

.loading { color: var(--muted); padding: 80px 0; text-align: center; }

/* ---------- live(실시간 서버) */
.live-pill { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text-2); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.live-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: 0 0 auto; }
.live-pill[data-state="on"] { color: var(--good-text); border-color: color-mix(in srgb, var(--good) 40%, transparent); cursor: default; }
.live-pill[data-state="on"] .dot { background: var(--good); }
.live-pill[data-state="waking"] .dot { background: var(--clay); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
@media (max-width: 560px) { .live-pill .t { display: none; } .live-pill { width: 44px; padding: 0; justify-content: center; } }
.live-card { border-color: color-mix(in srgb, var(--clay) 45%, var(--border)); }
.live-tag { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; letter-spacing: .04em; color: var(--accent); }
.live-tag .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
body[data-live="on"] .when-off { display: none; }
body:not([data-live="on"]) .when-on { display: none; }
.live-note { display: flex; gap: 8px; align-items: flex-start; margin: 14px 0 0; font-size: 13px; color: var(--muted); }
.live-note .ic { margin-top: 2px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.sm { min-height: 44px; padding: 0 18px; font-size: 14px; }
.form-grid { display: grid; gap: 14px 16px; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: end; }
.form-grid .span2 { grid-column: span 2; }
@media (max-width: 900px) { .form-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 480px) { .form-grid { grid-template-columns: 1fr; } .form-grid .span2 { grid-column: auto; } }
.inp { width: 100%; min-height: 44px; font: inherit; font-size: 15px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border-strong);
  background: var(--surface); color: var(--text); font-variant-numeric: tabular-nums; }
.form-grid .select select, .member .select select { min-height: 44px; border-radius: 10px; }
.check { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-size: 14px; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
.checks { display: flex; gap: 4px 18px; flex-wrap: wrap; border: 0; margin: 0; padding: 0; min-width: 0; }
.checks legend { padding: 0; }
.members { display: flex; flex-direction: column; gap: 10px; }
.member { display: grid; grid-template-columns: 110px minmax(0, 1fr) minmax(0, 1fr) auto 44px; gap: 10px 12px; align-items: end; padding: 12px 14px;
  border-radius: 12px; background: var(--surface-2); }
@media (max-width: 700px) { .member { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.toolbar .grow { flex: 1 1 auto; }
.spin { width: 15px; height: 15px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; display: inline-block;
  animation: spin .8s linear infinite; flex: 0 0 auto; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin, .live-pill[data-state="waking"] .dot { animation: none; } }
table.verdict td { vertical-align: top; }
table.verdict td.num { text-align: right; white-space: nowrap; }
table.verdict th.num { text-align: right; }
.choices.compact .choice { min-height: 48px; padding: 10px 14px; }

<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#home" aria-label="복지트윈 개요로">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true"><circle cx="11" cy="14" r="7.5" stroke="currentColor" stroke-width="1.8"/><circle cx="17" cy="14" r="7.5" stroke="var(--clay)" stroke-width="1.8"/></svg>

        <svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 8l-4 4 4 4M16 8l4 4-4 4M13.5 5l-3 14"/></svg><span>GitHub</span></a>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="화면 모드 전환"></button>

</header>
<main class="wrap">
  <section class="view active" id="v-home"><div class="loading">불러오는 중…</div></section>
  <section class="view" id="v-rules"></section>
  <section class="view" id="v-blind"></section>
  <section class="view" id="v-cliff"></section>
  <section class="view" id="v-sim"></section>
  <section class="view" id="v-bt"></section>
</main>
<footer>
  <div class="wrap">
    <p>2026 사회보장 데이터를 활용한 AI 혁신 아이디어 경진대회 출품작. 실시간 계산 서버가 연결되면 가구 판정·소득 스윕·Z3 검증·정책 시나리오를 직접 계산하고,
      연결되지 않으면 <b>사전 계산본</b>을 보여 줍니다. LLM 이 필요한 사업안 직접 입력(레드팀)은 로컬 대시보드에서만 합니다.
      실제 개인 데이터 없이 공개 집계표(KOSIS·e-나라지표 등)로 만든 합성 가구만 쓰고, 규칙마다 단순화 가정을 화면에 밝힙니다.</p>
    <p><a href="https://github.com/LeeJaeHaeng/WelfareTwin" target="_blank" rel="noopener">GitHub</a><span id="genAt"></span></p>
  </div>
</footer>
<script>
const VIEWS = [["home", "개요", ""], ["rules", "법전 → 코드", "01"], ["blind", "사각지대", "02"], ["cliff", "급여 절벽", "03"],
               ["sim", "시뮬레이터·레드팀", "04"], ["bt", "백테스트", "05"]];
// 제도 → 색: 고정 배정(순위·필터와 무관). 프리셋별 누적 순서에서 인접쌍이 색각 검증을 통과하도록 근로장려금=보라, 지자체=분홍.
const SERIES = { NBLS_LIVELIHOOD: ["생계급여", "--s-liv"], NBLS_HOUSING: ["주거급여", "--s-hou"], NBLS_EDUCATION: ["교육급여", "--s-edu"],
  BASIC_PENSION: ["기초연금", "--s-bp"], EITC: ["근로장려금", "--s-eitc"], ENERGY_VOUCHER: ["에너지바우처", "--s-ev"], LOCAL: ["지자체 사업", "--s-local"] };
let B = null, S = null;
const $ = id => document.getElementById(id);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const won = v => `${Math.round(v).toLocaleString("ko-KR")}원`;
const num = v => Math.round(v).toLocaleString("ko-KR");
const man = v => `${(v / 1e4).toLocaleString("ko-KR", { maximumFractionDigits: 1 })}만`;
const pct = (v, d = 1) => `${(v * 100).toFixed(d)}%`;
const signed = v => (v > 0 ? "+" : v < 0 ? "−" : "") + num(Math.abs(v));
const firstLine = t => String(t || "").split("\n")[0].replace(/^\[[^\]]+\]\s*/, "");

const ICONS = {
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  alert: '<path d="M12 4.5l8.5 15h-17z"/><path d="M12 10.5v4M12 17.3v.01"/>',
  x: '<circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>',
  arrowR: '<path d="M5 12h14M13 6l6 6-6 6"/>',
  arrowL: '<path d="M19 12H5M11 6l-6 6 6 6"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.8v.01"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6L6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/>',
  moon: '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',
  chevR: '<path d="M9 6l6 6-6 6"/>',
  chevD: '<path d="M6 9l6 6 6-6"/>',
  code: '<path d="M8 8l-4 4 4 4M16 8l4 4-4 4"/>',
  book: '<path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5zM20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z"/>',
  shield: '<path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
  up: '<path d="M12 19V5M6 11l6-6 6 6"/>',
  down: '<path d="M12 5v14M6 13l6 6 6-6"/>',
  person: '<circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/>',
};
const icon = (n, s = 16) => `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;
const chap = (k, title, lead) => {
  const v = VIEWS.find(x => x[0] === k);
  return `<header class="chap"><p class="eyebrow"><span class="num">${v[2]}</span>${v[1]}</p><h1 class="display chapter">${title}</h1><p class="lead">${lead}</p></header>`;
};
const pager = k => {
  const i = VIEWS.findIndex(v => v[0] === k), p = VIEWS[i - 1], n = VIEWS[i + 1];
  return `<nav class="pager" aria-label="장면 이동">
    ${p ? `<a href="#${p[0]}"><span class="dir">${icon("arrowL", 14)} 이전 장면</span><span class="t">${p[2] ? p[2] + " " : ""}${p[1]}</span></a>` : ""}
    ${n ? `<a class="next" href="#${n[0]}"><span class="dir">다음 장면 ${icon("arrowR", 14)}</span><span class="t">${n[2]} ${n[1]}</span></a>` : ""}</nav>`;
};
const stat = (l, v, s = "", cls = "") => `<div class="stat ${cls}"><p class="l">${l}</p><p class="v">${v}</p>${s ? `<p class="s">${s}</p>` : ""}</div>`;
const selectBox = (id, label, options) => `<label class="field-label" for="${id}">${label}</label>
  <div class="select"><select id="${id}">${options}</select>${icon("chevD", 18)}</div>`;

function layoutBase(extra = {}) {
  return Object.assign({
    paper_bgcolor: "rgba(0,0,0,0)", plot_bgcolor: "rgba(0,0,0,0)",
    font: { family: "Pretendard, sans-serif", color: css("--text-2"), size: 12 },
    margin: { t: 16, r: 12, b: 56, l: 72 }, hovermode: "x unified",
    xaxis: { gridcolor: css("--grid"), zeroline: false, tickformat: ",", linecolor: css("--axis"), tickfont: { color: css("--muted") } },
    yaxis: { gridcolor: css("--grid"), zeroline: false, tickformat: ",", linecolor: css("--axis"), tickfont: { color: css("--muted") } },
    legend: { orientation: "h", x: 0, y: 1.02, yanchor: "bottom", font: { color: css("--text-2"), size: 12 } },
    hoverlabel: { bgcolor: css("--surface"), bordercolor: css("--border-strong"), font: { color: css("--text"), family: "Pretendard, sans-serif" } },
  }, extra);
}
const axis = (o = {}) => Object.assign({ gridcolor: css("--grid"), zeroline: false, tickformat: ",", linecolor: css("--axis"),
  tickfont: { color: css("--muted") }, automargin: true }, o);
const CFG = { displayModeBar: false, responsive: true };

// ---------------------------------------------------------------- 실시간 계산 서버(없거나 연결이 안 되면 사전 계산본)
const API = (new URLSearchParams(location.search).get("api") || document.querySelector('meta[name="wt-api"]')?.content || "").replace(/\/+$/, "");
const LIVE = { state: API ? "waking" : "off", info: null };
const LIVE_HOOKS = {};          // 화면별: 연결되면 다시 그릴 것
let REGIONS = null;
const errBox = e => `<div class="callout crit">${icon("alert")}<div>${esc(e && e.message ? e.message : e)}</div></div>`;
const liveTag = t => `<span class="live-tag"><span class="dot" aria-hidden="true"></span>${t}</span>`;
const liveNote = what => `<p class="live-note when-off">${icon("info", 14)}<span>${what} — 실시간 서버에 연결되면 쓸 수 있어요 <span class="live-status"></span></span></p>`;
async function api(path, body, timeout = 90000) {
  if (!API) throw new Error("실시간 서버 주소가 없습니다.");
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), timeout);
  try {
    const r = await fetch(API + path, body === undefined ? { signal: ctl.signal }
      : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body), signal: ctl.signal });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) {
      const d = j.detail;
      throw new Error(typeof d === "string" ? d : Array.isArray(d) ? `입력값을 확인해 주세요: ${d.map(x => (x.loc || []).slice(1).join(".")).join(", ")}` : `서버 오류 ${r.status}`);
    }
    return j;
  } catch (e) {
    if (e.name === "AbortError") throw new Error("서버 응답이 늦습니다. 잠시 뒤 다시 시도해 주세요.");
    if (e instanceof TypeError) throw new Error("서버에 연결하지 못했습니다. 잠시 뒤 다시 시도해 주세요.");
    throw e;
  } finally { clearTimeout(timer); }
}
function paintLive() {
  const s = LIVE.state, pill = $("livePill");
  const txt = { on: "실시간 계산", waking: "서버 연결 중", error: "사전 계산본", off: "사전 계산본" }[s];
  pill.dataset.state = s;
  pill.querySelector(".t").textContent = txt;
  pill.title = s === "on" ? `계산 서버 연결됨 — ${API.replace(/^https?:\/\//, "")}`
    : s === "waking" ? "계산 서버에 연결하는 중입니다(처음 접속이면 몇 초 걸려요)"
    : API ? "서버에 연결되지 않아 사전 계산본을 보여 줍니다 — 눌러서 다시 연결" : "사전 계산본";
  pill.setAttribute("aria-label", s === "on" ? "실시간 계산 서버 연결됨" : `${txt}${API ? " — 눌러서 서버에 다시 연결" : ""}`);
  document.body.dataset.live = s;
  document.querySelectorAll("[data-needs-live]").forEach(b => { if (!b.dataset.busy) b.disabled = s !== "on"; });
  document.querySelectorAll(".live-status").forEach(el => { el.textContent = s === "waking" ? "(지금 서버에 연결하는 중…)" : s === "error" ? "(지금은 연결되지 않음)" : ""; });
}
async function connect() {
  if (!API) { LIVE.state = "off"; return paintLive(); }
  LIVE.state = "waking"; paintLive();
  const t0 = Date.now();
  while (Date.now() - t0 < 60000) {
    try {
      const h = await api("/health", undefined, 8000);
      if (h.ok) {
        LIVE.state = "on"; LIVE.info = h; paintLive();
        api("/regions", undefined, 15000).then(r => { REGIONS = r; }).catch(() => {});
        const cur = location.hash.slice(1) || "home";
        if (LIVE_HOOKS[cur]) LIVE_HOOKS[cur]();
        return;
      }
    } catch (e) {}
    await new Promise(r => setTimeout(r, 4000));
  }
  LIVE.state = "error"; paintLive();
}
async function busy(btn, label, fn) {
  const old = btn.innerHTML;
  btn.dataset.busy = "1"; btn.disabled = true; btn.innerHTML = `<span class="spin" aria-hidden="true"></span>${label}`;
  try { return await fn(); }
  finally { delete btn.dataset.busy; btn.innerHTML = old; btn.disabled = LIVE.state !== "on"; }
}

// ---------------------------------------------------------------- 개요
function viewHome() {
  const rules = B.rules || [], agree = rules.filter(r => r.crosscheck && r.crosscheck.agree).length;
  const sc = B.scenario.scenarios[0].metrics, bt = B.backtest, sc2 = B.blindspot_scale, rt = B.redteam;
  const maxCliff = Math.max(...B.cliff_z3.items.map(i => i.facts.loss));
  const nHh = B.population?.n_households || 100000;
  const cards = [
    ["rules", "AI 가 지자체 사업 원문을 두 번 규칙으로 옮기고, Z3 가 두 초안이 같은지 증명", `${agree}/${rules.length}건 동치`],
    ["blind", "빈곤선 아래인데 소득보장 3종에서 모두 탈락하는 가구 유형", `${B.blindspot.items.length}개 유형 · ${B.blindspot.elapsed_sec}초`],
    ["cliff", "1만원을 더 벌었더니 손에 쥐는 돈이 줄어드는 구간", `최대 −${num(maxCliff)}원`],
    ["sim", "선정기준·신청 방식을 바꾸면 누가 들어오고 누가 빠지나", `레드팀 ${rt.timings.total}초`],
    ["bt", "과거 제도 변화를 재현해 실제 수급 통계와 비교", `오차 ${pct(bt.households.error_rate)}`]];
  $("v-home").innerHTML = `
    <div class="hero">
      <div class="main">

function viewRules() {
  const rules = B.rules || [];
  const def = Math.max(0, rules.findIndex(r => r.serv_id === "WLF00005691"));
  $("v-rules").innerHTML = chap("rules", "원문 한 줄이 실행 가능한 규칙이 되기까지",
    "지자체 사업 원문을 AI 가 두 번(서로 다른 프롬프트) 규칙으로 옮기고, Z3 가 두 초안의 판정이 모든 가구에서 같은지 증명합니다. 다르면 판정이 갈리는 가구를 찾아 사람이 검수합니다.") + `
    <div class="card mb2">${selectBox("ruleSel", `사업 선택 · 대구·경북 ${rules.length}건`,
      rules.map((r, i) => `<option value="${i}" ${i === def ? "selected" : ""}>${esc(r.name)} (${esc(r.text?.region || "")})</option>`).join(""))}</div>
    <div id="ruleBody"></div>` + pager("rules");
  const render = i => {

    const badge = e.equivalent === true ? `<span class="pill good">${icon("check", 14)} A·B 판정 동치 (Z3 증명)</span>`
      : e.equivalent === false ? `<span class="pill crit">${icon("alert", 14)} A·B 판정 불일치 → 사람 검수</span>` : `<span class="pill">미확정</span>`;
    const qi = r.A.quote_issues.length;
    const period = rule.benefit && ("monthly" in rule.benefit ? "monthly" : "annual");
    $("ruleBody").innerHTML = `
      <div class="grid g2">
        <div class="card"><p class="card-label">원문 · 한국사회보장정보원 지자체복지서비스</p>
          <h3 class="mt">지원대상</h3><div class="textblock">${esc(r.text?.target)}</div>
          <h3 class="mt2">선정기준</h3><div class="textblock">${esc(r.text?.criteria)}</div>
          <h3 class="mt2">지원내용</h3><div class="textblock">${esc(r.text?.benefit)}</div></div>
        <div class="card"><p class="card-label">추출된 규칙 · 승인본</p>
          <div class="pills mt">${badge}<span class="pill ${qi ? "crit" : "good"}">${icon(qi ? "alert" : "check", 14)} 근거 인용 ${qi ? "불일치" : "원문 일치"}</span>
            <span class="pill">자동 테스트 ${r.n_tests}건</span></div>
          <div class="tbl-wrap mt2"><table><thead><tr><th>조건</th><th>식</th><th>근거 인용</th></tr></thead><tbody>
            ${(rule.eligibility?.all || []).map(c => `<tr><td>${esc(c.label)}${c.uncertain ? ' <span class="pill">불확실</span>' : ""}</td>
              <td class="mono">${esc(c.expr)}</td><td class="small muted">${esc(c.quote || "")}</td></tr>`).join("")}
          </tbody></table></div>
          ${period ? `<div class="callout mt">${icon("info")}<div><b>급여(${period === "monthly" ? "월" : "연"})</b> <span class="mono">${esc(rule.benefit[period])}</span><br><span class="muted">${esc(rule.benefit.quote || "")}</span></div></div>` : ""}
          ${rule.region ? `<p class="small muted mt">지역: ${esc(rule.region.sido)} ${esc(rule.region.sigungu || "")}</p>` : ""}
          ${(rule.not_modeled || []).length ? `<details><summary>${icon("chevR", 14)} 규칙으로 표현하지 못한 조건 ${rule.not_modeled.length}개 (담당자 확인 필요)</summary>
            <ul class="bullets">${rule.not_modeled.map(n => `<li>${esc(n.quote)} — <span class="muted">${esc(n.reason)}</span></li>`).join("")}</ul></details>` : ""}
          ${(rule.provenance?.human_edits || []).length ? `<div class="callout mt">${icon("person")}<div><b>사람 검수 수정</b><br>${esc(rule.provenance.human_edits.join(" / "))}</div></div>` : ""}
          ${e.equivalent === false ? `<div class="callout crit mt">${icon("alert")}<div><b>두 초안의 판정이 갈리는 가구 (Z3 반례)</b><br>${esc(e.household_text)}<br>

        </div>
      </div>`;
  };
  $("ruleSel").onchange = ev => render(+ev.target.value);
  render(def);
}

          $("blindItems").innerHTML = blindCards(r.items);
        }
      } catch (e) { $("blindMsg").innerHTML = errBox(e); }
    });
  };
}

  show(location.hash.slice(1) || "home", false);
  window.addEventListener("hashchange", () => show(location.hash.slice(1) || "home"));
}).catch(err => {
  $("v-home").classList.add("active");
  $("v-home").innerHTML = `<div class="callout crit">${icon("alert")}<div>데이터를 불러오지 못했습니다: ${esc(err)}</div></div>`;
});
</script>
</body>
</html>
